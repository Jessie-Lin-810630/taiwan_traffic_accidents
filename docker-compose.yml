# x-開頭，代表擴充欄位，x-這段內容是僅供參考，不要直接啟動服務，且這段內容給一個&airflow-common錨點。
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: ./docker/Dockerfile.airflow
  environment:
    # ====Airflow 3.x 核心變數 ====
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}

    # ==== Airflow 3.x 新架構：API 與 SDK 設定 ====
    # 在 3.x 中，許多內部通訊改走 API 埠 (8080)
    AIRFLOW__API__SERVER_HOST: 0.0.0.0
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
    AIRFLOW__TASK_SDK__ENABLED: "True"
    AIRFLOW__CORE__TASK_RUNNER: "StandardTaskRunner"

    # 連向 webserver (3.x 中 webserver 兼任 API Server)
    AIRFLOW__CONFIG__FASTAPI_API_URL: "http://airflow-webserver:8080"
    AIRFLOW__API__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/api/v1"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"

    # 核心連線設定
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-db:3306/${MYSQL_AIRFLOW_DATABASE}

    # 專案路徑
    PYTHONPATH: "/opt/airflow/"

    # 以下九個是 src/ 底下的程式會 os.getenv 的全部變數，值由 compose.yml 從專案根目錄的 .env 插值。
    # *_HOST / *_PORT 在此寫死，因為 .env 那組是給宿主機連進容器用的，
    # 容器之間走 backend_net，要用服務名與容器實際監聽埠。
    MYSQL_HOST: mysql-db
    MYSQL_PORT: 3306
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    REDIS_HOST: redis-cache
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    GOOGLE_MAP_API_KEY: ${GOOGLE_MAP_API_KEY}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    # ETL 抓回的原始檔與處理後的 CSV（ADR-0007）。
    # 不掛載的話會寫進容器可寫層，docker compose up --build 之後就消失。
    - ./data:/opt/airflow/data
  networks:
    - backend_net
  restart: always

services:
  # 1. 關聯式資料庫
  mysql-db:
    image: mysql:8.0.36
    container_name: mysql_server
    restart: always
    # mysql image 初始化真正會讀的變數只有 4 個，值由 compose 從專案根目錄的 .env 插值。
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # image 只會在首次啟動時建一個庫，這個名額留給 airflow metadata 庫。
      # 業務庫另行手動建立與授權。
      MYSQL_DATABASE: ${MYSQL_AIRFLOW_DATABASE}
      # airflow 容器與 ETL 連進來所用的帳密，image 會建這個 user 並授予上面那個庫的權限。
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # .env 的 MYSQL_HOST / MYSQL_PORT 是宿主端連進來用的，容器本身不需要，故不注入 environment，僅在此插值。
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. 快取記憶體資料庫
  redis-cache:
    image: redis:7.0-alpine
    container_name: redis_server
    restart: always
    # 下面 command 與 healthcheck 裡的 ${REDIS_PASSWORD} 由 compose.yml 插值完成，
    # 並靠啟動參數帶入密碼到 redis server，不需要注入容器環境，故沒有 environment 區塊。
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 3gb --protected-mode no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 10s
      timeout: 3s
      retries: 10

  # ==== Airflow 初始化層 ====

  airflow-init:
    <<: *airflow-common # 合併運算子：把整塊模板解壓縮到各個 Service 中。
    container_name: airflow_init
    restart: "no" # 執行完就結束
    environment:
      # 暫時覆蓋前言所造的環境變數，讓init可以用root順利登入MySQL，因為我們目標是確認airflow-mysql可以正常連線，而不是因授權問題而被拒絕在外。
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-db:3306/${MYSQL_AIRFLOW_DATABASE}
    command: >
      bash -c " echo '==== 檢查環境變數 ====' && echo 'DB_CONN: $$AIRFLOW__DATABASE__SQL_ALCHEMY_CONN' && airflow version && echo '==== 開始資料庫遷移 ====' && airflow db migrate &&  echo '==== 開始建立使用者 ====' && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD}  --firstname Jessie --lastname Lin --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true"
    depends_on:
      mysql-db: { condition: service_healthy }
      redis-cache: { condition: service_healthy }

  # ==== Airflow 運行層 ====
  # 3a. Airflow Webserver (儀表板)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: api-server # AirFlow 3.x開始已經改為api-server
    ports: [ "8081:8080" ]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # 3b. Airflow Scheduler (調度心臟)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # 3c. Airflow Triggerer (處理非同步任務)
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: triggerer
    depends_on:
      airflow-init: { condition: service_completed_successfully }

networks:
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
