# x-開頭，代表擴充欄位，x-這段內容是僅供參考，不要直接啟動服務，且這段內容給一個&airflow-common錨點。
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: ./docker/Dockerfile.airflow
  env_file:
    - .env
  environment:
    # ====Airflow 3.x 核心變數 ====
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY}

    # ==== Airflow 3.x 新架構：API 與 SDK 設定 ====
    # 在 3.x 中，許多內部通訊改走 API 埠 (8080)
    AIRFLOW__API__SERVER_HOST: 0.0.0.0
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth"
    AIRFLOW__TASK_SDK__ENABLED: "True"
    AIRFLOW__CORE__TASK_RUNNER: "StandardTaskRunner"

    # 連向 webserver (3.x 中 webserver 兼任 API Server)
    AIRFLOW__CONFIG__FASTAPI_API_URL: "http://airflow-webserver:8080"
    AIRFLOW__API__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/api/v1"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"

    # 核心連線設定
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql-db:3306/${MYSQL_AIRFLOW_DATABASE}

    # 專案路徑與 API
    PYTHONPATH: "/opt/airflow/"
    GOOGLE_MAP_API_KEY: ${GOOGLE_MAP_API_KEY}
    REDIS_HOST: ${REDIS_HOST}
    REDIS_PORT: ${REDIS_PORT}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    MYSQL_HOST: ${MYSQL_HOST}
    MYSQL_PORT: 3306
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_AIRFLOW_DATABASE: ${MYSQL_AIRFLOW_DATABASE}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
  networks:
    - backend_net
  restart: always

services:
  # 1. 關聯式資料庫
  mysql-db:
    image: mysql:8.0.36
    env_file:
      - .env
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_AIRFLOW_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # 2. 快取記憶體資料庫
  redis-cache:
    image: redis:7.0-alpine
    container_name: redis_server
    restart: always
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 3gb --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend_net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG" ]
      interval: 10s
      timeout: 3s
      retries: 10

  # ==== Airflow 初始化層 ====

  airflow-init:
    <<: *airflow-common # 合併運算子：把整塊模板解壓縮到各個 Service 中。
    container_name: airflow_init
    restart: "no" # 執行完就結束
    command: >
      bash -c " echo '==== 檢查環境變數 ====' && echo 'DB_CONN: $AIRFLOW__DATABASE__SQL_ALCHEMY_CONN' && airflow version && echo '==== 開始資料庫遷移 ====' && airflow db migrate &&  echo '==== 開始建立使用者 ====' && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD}  --firstname Jessie --lastname Lin --role Admin --email ${AIRFLOW_ADMIN_EMAIL} || true"
    depends_on:
      mysql-db: { condition: service_healthy }
      redis-cache: { condition: service_healthy }

  # ==== Airflow 運行層 ====
  # 3a. Airflow Webserver (儀表板)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports: [ "8081:8080" ]
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # 3b. Airflow Scheduler (調度心臟)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # 3c. Airflow Triggerer (處理非同步任務)
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow_triggerer
    command: triggerer
    depends_on:
      airflow-init: { condition: service_completed_successfully }

networks:
  backend_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
