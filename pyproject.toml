[project]
name = "taiwan-traffic-accidents"
version = "0.1.0"
description = ""
authors = [
    {name = "Jessie_lin",email = "lucky460721@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (==2.3.3)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "pymysql (==1.1.2)",
    "bs4 (>=0.0.2,<0.0.3)",
    "pytest (>=9.0.2,<10.0.0)",
    "streamlit (>=1.55.0,<2.0.0)",
    "folium (>=0.20.0,<0.21.0)",
    "redis (>=7.4.0,<8.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "google-cloud-storage (>=3.0.0,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
    "E501",  # ruff-format 負責程式碼行長，剩下的都是 formatter 無法拆的 docstring／字串
    "D415",  # 本專案 docstring 為中文，全形句號「。」不被 D415 接受
]

[tool.ruff.lint.pydocstyle]
convention = "google"
