name: Deploy-to-GCP-VM-practice-cicd-tjr104  # 機器人的名字

on:
  push:
    branches:
      - main # 生產環境
      - UAT  # 上線前的驗收兼測試環境
    paths-ignore:      # 忽略以下路徑的變動
      - '**.md'        # 所有 Markdown 文件
      - 'docs/**'      # docs 資料夾

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 用 requirements.txt 而非 poetry：這份清單本身就是下個 job 容器啟動時的安裝依據，
      # 在 CI 階段可順帶檢查它與 pyproject.toml 是否還同步。
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test/unit_test/

  deploy:
    needs: test
    runs-on: ubuntu-latest # 機器人跑在 GitHub 提供的 Linux 虛擬機上
    permissions:
      contents: read
      id-token: write

    # 描述deploy job由哪些task組成
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 步驟1: 讓機器人抓取你的程式碼、不需要自己進入VM做git clone

      - name: Set up SSH Private Key # 步驟2: 幫機器人裝上鑰匙，讓它能透過 SSH 敲 VM 的門
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          chmod 644 ~/.ssh/id_rsa.pub

      # 步驟 3: 登入 Google Cloud，讓gcloud知道機器人有被授權可以使用部分cloud API(取決於SA怎麼設定)
      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 步驟 4: 設定 gcloud SDK
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      # 步驟 5: 透過 IAP 隧道走google內網，找到VM 22 port，然後執行一系列遠端指令：登入VM、創立.env、git pull、docker compose up
      # 加上 --ssh-key-file 強制指定使用放在~/.ssh/id_rsa的那把鑰匙
      - name: Deploy via IAP Tunnel
        run: |
          gcloud compute ssh ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_VM_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --tunnel-through-iap \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --ssh-key-file=~/.ssh/id_rsa \
            --quiet \
            --command="
              cd ~/${{ secrets.GCP_SSH_USER }}/taiwan_traffic_accidents_CICD_practice &&

              echo 'MYSQL_HOST=${{ secrets.MYSQL_HOST }}' > .env &&
              echo 'MYSQL_PORT=${{ secrets.MYSQL_PORT }}' >> .env &&
              echo 'MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}' >> .env &&
              echo 'MYSQL_AIRFLOW_DATABASE=${{ secrets.MYSQL_AIRFLOW_DATABASE }}' >> .env &&
              echo 'MYSQL_USER=${{ secrets.MYSQL_USER }}' >> .env &&
              echo 'MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}' >> .env &&
              echo 'MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}' >> .env &&
              echo 'REDIS_HOST=${{ secrets.REDIS_HOST }}' >> .env &&
              echo 'REDIS_PORT=${{ secrets.REDIS_PORT }}' >> .env &&
              echo 'REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}' >> .env &&
              echo 'GOOGLE_MAP_API_KEY=${{ secrets.GOOGLE_MAP_API_KEY }}' >> .env &&
              echo 'AIRFLOW_SECRET_KEY=${{ secrets.AIRFLOW_SECRET_KEY }}' >> .env &&
              echo 'AIRFLOW_ADMIN_USER=${{ secrets.AIRFLOW_ADMIN_USER }}' >> .env &&
              echo 'AIRFLOW_ADMIN_PASSWORD=${{ secrets.AIRFLOW_ADMIN_PASSWORD }}' >> .env &&
              echo 'AIRFLOW_ADMIN_EMAIL=${{ secrets.AIRFLOW_ADMIN_EMAIL }}' >> .env &&

              export GIT_SSH_COMMAND='ssh -i ~/.ssh/for_git_clone -o IdentitiesOnly=yes' &&

              git pull origin ${GITHUB_REF_NAME} &&

              docker compose up -d --build
            "
